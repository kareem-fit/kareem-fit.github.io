name: push-notifications
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd push && npm install firebase-admin@12 --no-audit --no-fund
      - run: node push/send.js
        env:
          FCM_KEY: ${{ secrets.FCM_KEY }}
      - name: keep schedule alive
        run: if [ "$(date -u +%H%M)" -lt 0010 ]; then gh api -X PUT "repos/${{ github.repository }}/actions/workflows/push.yml/enable" || true; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
