*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.55;direction:rtl}

.btn.p{background:linear-gradient(180deg,#FFB56F,#F4600F);border:0;color:#fff;box-shadow:0 4px 0 #B63504;text-shadow:0 1px 2px rgba(110,28,0,.5)}

P2.t=o.t.slice();P2.o=String(o.o||"").slice(0,600);
if(!Array.isArray(o.m)||!o.m.length||o.m.length>8)throw"الوجبات (m) من 1 لـ 8.";

async function goList(){SCR="list";MODE="coach";UI.list=null;UI.cd=null;render();try{var l=await sList();l.sort(function(a,b){return String(b.u||"").localeCompare(String(a.u||""))});UI.list=l}catch(e){UI.list=[]}render()}
async function openPlan(id){var r=await sGet(id);if(!r)return;P=r.p;if(!P.cf)P.cf={};AD();CUR=id;MODE="coach";SCR="edit";UI.sheet=null;UI.reps=null;render();loadReps()}
async function openClient(id){MODE="client";SCR="client";CUR=id;var r=null;try{r=await sGet(id)}catch(e){}
if(!r){SCR="msg";UI.msg="الخطة مش موجودة، أو اللينك مش صح. اطلب من كريم يبعتلك اللينك تاني.";render();return}
BASE=r.p;SRV_U=r.u;var ov=lget("kfp2c:"+id,null);if(ov&&ov.u===r.u){P=ov.p}else{P=clone(r.p);if(ov){UI.upd=true;ldel("kfp2c:"+id)}}
if(!P.cf)P.cf={};AD();render()}
function isCoach(u){return !!(u&&u.email===KS.ADMIN&&u.emailVerified)}
function loginView(m){SCR="msg";UI.msg="";var a=$("#app");var inapp=KS.inApp&&KS.inApp();a.innerHTML='<div class="card" style="margin-top:40px;text-align:center"><h1 class="hd">خطط الأكل</h1><p class="sub" style="margin:8px 0 14px">'+esc(m||"الصفحة دي للمدرب. سجّل دخول بحساب جوجل بتاعك.")+'</p>'+(inapp?'<p class="sub">افتح اللينك في كروم أو سفاري عشان تسجّل دخول.</p>':'<button class="btn p" id="gin">الدخول بجوجل</button>')+'</div>';var g=$("#gin");if(g)g.onclick=function(){KS.signIn().catch(function(e){var t=KS.signInMsg?KS.signInMsg(e):"";if(t)loginView(t)})}}
async function boot(){var id=qid();
if(typeof KS==="undefined"||!KS.fs){SCR="msg";UI.msg="مقدرتش أتصل بالسيرفر. تأكد من النت وجرّب تاني.";render();return}
ST.db=KS.fs;
if(id){await openClient(id);return}
var started=false;KS.auth.onAuthStateChanged(async function(u){if(isCoach(u)){if(!started){started=true;await goList()}}else{started=false;loginView(u?"الحساب ده مش حساب المدرب.":"")}})}
/* ---- الأحداث ---- */
document.addEventListener("click",async function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a"),m=+b.getAttribute("data-m"),i=+b.getAttribute("data-i"),id=b.getAttribute("data-id");
if(a==="ovl"){if(e.target===b){UI.sheet=null;render()}return}
if(a==="newplan"){var nid=newId();P=newPlan();CUR=nid;try{await sSave(nid,P)}catch(x){}MODE="coach";SCR="edit";UI.reps=[];render();return}
if(a==="imp"){UI.sheet={t:"imp"};render();return}
if(a==="impgo"){var er=$("#imperr"),np;try{np=impParse($("#impt").value)}catch(x){er.textContent=typeof x==="string"?x:"النص فيه مشكلة.";er.hidden=false;return}
var nid2=newId();try{await sSave(nid2,np)}catch(x){er.textContent="مقدرتش أحفظ. جرّب تاني.";er.hidden=false;return}
P=np;CUR=nid2;MODE="coach";SCR="edit";UI.sheet=null;UI.reps=[];render();toast("اتعملت الخطة");return}
if(a==="open"){await openPlan(id);return}
if(a==="lnk"){copyTxt(linkFor(id));return}
if(a==="dup"){var r=await sGet(id);if(r){r.p.n=(r.p.n||"")+" (نسخة)";await sSave(newId(),r.p);await goList()}return}
if(a==="rm"){if(UI.cd===id){await sDel(id);UI.cd=null;await goList()}else{UI.cd=id;render()}return}
if(a==="tolist"){clearTimeout(ST_T);if(SCR==="edit"){try{await sSave(CUR,P)}catch(x){}}await goList();return}
if(a==="st"){var it=P.m[m].i[i],d=+b.getAttribute("data-d")*stp(it.f);it.q=Math.max(0,Math.round((it.q+d)*10)/10);ch()}
else if(a==="del"){P.m[m].i.splice(i,1);ch()}
else if(a==="swap"){UI.sheet={t:"swap",m:m,i:i};render()}
else if(a==="add"){UI.sheet={t:"add",m:m};UI.q="";UI.cat="all";render()}
else if(a==="close"){UI.sheet=null;render()}
else if(a==="pick"){var it2=P.m[UI.sheet.m].i[UI.sheet.i],nk=b.getAttribute("data-k"),nq=+b.getAttribute("data-q"),oF=it2.f,oQ=it2.q;if(swMode(it2)==="S"){it2.s=it2.s.filter(function(x){return x.k!==nk});it2.s.push({k:oF,q:oQ})}it2.f=nk;it2.q=nq;UI.sheet=null;ch()}
else if(a==="addpick"){var k=b.getAttribute("data-k");var ni={f:k,q:FOODS[k].w?1:100};if(MODE==="client")ni.x=1;P.m[UI.sheet.m].i.push(ni);UI.sheet=null;ch()}
else if(a==="cat"){UI.cat=b.getAttribute("data-c");$("#cc").innerHTML=chipsHTML();$("#sb").innerHTML=UI.sheet.t==="chk"?chkList():addList()}
else if(a==="swset"){var itw=P.m[m].i[i];UI.sheet={t:"chk",kind:"swap",m:m,i:i};UI.sel=clone(itw.s);UI.q="";UI.cat="all";render()}
else if(a==="adset"){UI.sheet={t:"chk",kind:"add"};UI.sel=AD().l.slice();UI.q="";UI.cat="all";render()}
else if(a==="tog"){var k2=b.getAttribute("data-k"),ix=selIdx(k2),sw=UI.sheet.kind==="swap";if(ix>-1)UI.sel.splice(ix,1);else if(sw){var itz=P.m[UI.sheet.m].i[UI.sheet.i];UI.sel.push({k:k2,q:eqQ(itz,k2)||(FOODS[k2].w?1:100)})}else UI.sel.push(k2);$("#sb").innerHTML=chkList();document.querySelector(".sh .btn.p").textContent="حفظ ("+UI.sel.length+")"}
else if(a==="togall"||a==="clrall"){var sw2=UI.sheet.kind==="swap",itq=sw2?P.m[UI.sheet.m].i[UI.sheet.i]:null;chkKeys().forEach(function(k3){var j=selIdx(k3);if(a==="togall"&&j<0)UI.sel.push(sw2?{k:k3,q:eqQ(itq,k3)||(FOODS[k3].w?1:100)}:k3);if(a==="clrall"&&j>-1)UI.sel.splice(j,1)});$("#sb").innerHTML=chkList();document.querySelector(".sh .btn.p").textContent="حفظ ("+UI.sel.length+")"}
else if(a==="chksave"){var sh=UI.sheet;if(sh.kind==="swap")P.m[sh.m].i[sh.i].s=clone(UI.sel);else AD().l=UI.sel.slice();UI.sheet=null;ch()}
else if(a==="custom"){UI.sheet={t:"cust",m:UI.sheet.m};render()}
else if(a==="delmeal"){if(P.m.length>1){P.m.splice(m,1);ch()}}
else if(a==="addmeal"){P.m.push({n:"وجبة "+(P.m.length+1),i:[]});ch()}
else if(a==="copy"){copyTxt(linkFor(CUR))}
else if(a==="preview"){clearTimeout(ST_T);try{await sSave(CUR,P)}catch(x){}PBAK=P;P=clone(P);UI.prev=true;MODE="client";render();window.scrollTo(0,0)}
else if(a==="back"){P=PBAK;UI.prev=false;MODE="coach";render()}
else if(a==="print"){try{window.print()}catch(x){}}
else if(a==="reloadrep"){loadReps();render()}
else if(a==="repagain"){UI.sent=false;render()}
else if(a==="sendrep"){var nt=($("#rn")&&$("#rn").value||"").slice(0,300);b.disabled=true;b.textContent="بيتبعت...";try{await ST.db.collection("plans").doc(CUR).collection("reports").doc(newId()).set({u:new Date().toISOString(),t:nt,d:repLines(),k:r0(tot()[0]),g:r0(P.t[0])});UI.sent=true;render();toast("اتبعت لكريم")}catch(x){b.disabled=false;b.textContent="ابعت التقرير";toast("مقدرتش أبعت. جرّب تاني")}}
else if(a==="reset"){ldel("kfp2c:"+CUR);P=clone(BASE);UI.upd=false;render()}
});
document.addEventListener("change",function(e){var t=e.target;
if(t.hasAttribute("data-qty")){P.m[+t.getAttribute("data-m")].i[+t.getAttribute("data-i")].q=num(t.value);ch()}
else if(t.hasAttribute("data-sq")){var ix=selIdx(t.getAttribute("data-k"));if(ix>-1)UI.sel[ix].q=num(t.value,1)}
else if(t.hasAttribute("data-mn")){P.m[+t.getAttribute("data-m")].n=t.value.slice(0,30);persist()}
else if(t.hasAttribute("data-pn")){P.n=t.value.slice(0,40);persist();var h=document.querySelector("h1.hd");if(h)h.textContent=P.n}
else if(t.hasAttribute("data-po")){P.o=t.value.slice(0,600);persist()}
else if(t.hasAttribute("data-sm")){var mm=+t.getAttribute("data-m"),ii=+t.getAttribute("data-i"),itx=P.m[mm].i[ii];if(t.value==="L")delete itx.s;else if(t.value==="A")itx.s="A";else{if(!Array.isArray(itx.s))itx.s=[];persist();UI.sheet={t:"chk",kind:"swap",m:mm,i:ii};UI.sel=clone(itx.s);UI.q="";UI.cat="all";render();return}ch()}
else if(t.hasAttribute("data-ad")){var ak=t.getAttribute("data-ad");if(ak==="m")AD().m=t.value;else AD()[ak]=+t.value;ch()}
else if(t.hasAttribute("data-t")){P.t[+t.getAttribute("data-t")]=num(t.value);ch()}});
document.addEventListener("input",function(e){if(e.target.id==="sq"){UI.q=e.target.value;$("#sb").innerHTML=UI.sheet.t==="chk"?chkList():addList()}});
document.addEventListener("submit",function(e){if(e.target.id!=="cf")return;e.preventDefault();var f=e.target,id="c"+Date.now().toString(36);P.cf=P.cf||{};
P.cf[id]={n:f.n.value.trim().slice(0,40)||"أكل",v:[num(f.k.value),num(f.p.value),num(f.c.value),num(f.f.value)],w:100,pn:"حصة",c:"custom"};
var ni={f:id,q:1};if(MODE==="client")ni.x=1;P.m[UI.sheet.m].i.push(ni);UI.sheet=null;ch()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&UI.sheet){UI.sheet=null;render()}});
render();boot();
})();
</script>
</body></html>
